<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OrchestrUI — agent-native UI orchestration</title>
  <desc id="desc">Seven UI ecosystems routed into one coherent interface.</desc>
