name: Bug report
description: Report a reproducible OrchestrUI problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve OrchestrUI. Share what you know; a proposed fix is not required. For suspected vulnerabilities, please use [private reporting](https://github.com/ECD5A/OrchestrUI/security/advisories/new)."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, commands or a small example. If you cannot reproduce it reliably, describe when it happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, agent host, framework, package manager and UI stack.
