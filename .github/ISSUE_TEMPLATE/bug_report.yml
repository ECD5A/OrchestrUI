name: Bug report
description: Report a reproducible OrchestrUI problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; use SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, agent host, framework, package manager and UI stack.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
