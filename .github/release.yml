changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
        - integration
        - routing
        - mcp
        - agent-skill
    - title: Fixes and quality
      labels:
        - bug
        - accessibility
        - performance
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
